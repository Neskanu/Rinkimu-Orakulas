{% extends "base.html" %}

{% block content %}
<div class="flex flex-col space-y-8">
    <div class="flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-bold text-slate-900">Election Dashboard</h1>
            <p class="text-slate-500">Analyze Lithuanian election results with deep drill-down capabilities.</p>
        </div>
        <form action="/dashboard/" method="get" class="flex items-center space-x-4">
            <select name="year" onchange="this.form.submit()"
                class="rounded-xl border-slate-200 text-sm focus:ring-indigo-500 focus:border-indigo-500">
                <option value="2024" {% if year==2024 %}selected{% endif %}>2024 (Latest)</option>
                <option value="2020" {% if year==2020 %}selected{% endif %}>2020</option>
                <option value="2016" {% if year==2016 %}selected{% endif %}>2016</option>
                <option value="2012" {% if year==2012 %}selected{% endif %}>2012</option>
            </select>

            <select name="district" onchange="this.form.submit()"
                class="rounded-xl border-slate-200 text-sm focus:ring-indigo-500 focus:border-indigo-500 min-w-[200px]">
                <option value="">Full National Data</option>
                {% for d in districts %}
                <option value="{{ d }}" {% if d==selected_district %}selected{% endif %}>{{ d }}</option>
                {% endfor %}
            </select>

            {% if selected_district %}
            <select name="precinct" onchange="this.form.submit()"
                class="rounded-xl border-slate-200 text-sm focus:ring-indigo-500 focus:border-indigo-500 min-w-[200px]">
                <option value="">All Precincts</option>
                {% for p in precincts %}
                <option value="{{ p }}" {% if p==selected_precinct %}selected{% endif %}>{{ p }}</option>
                {% endfor %}
            </select>
            {% endif %}
        </form>
    </div>

    {% if plot_json %}
    <div class="flex flex-col space-y-8 w-full">
        <!-- Bar Chart -->
        <div
            class="glass p-8 rounded-[2rem] border border-white/20 shadow-xl shadow-indigo-100/20 flex flex-col w-full">
            <div id="bar-chart" class="w-full h-[500px]"></div>
        </div>

        <!-- Pie Chart -->
        <div
            class="glass p-8 rounded-[2rem] border border-white/20 shadow-xl shadow-indigo-100/20 flex flex-col w-full">
            <div id="pie-chart" class="w-full h-[550px]"></div>
        </div>
    </div>

    <!-- Modelių statistika išimta, nes ne iki galo veikia -->
    <!-- <div class="mt-8">
        <h2 class="text-2xl font-bold text-slate-900 mb-4">Model Performance</h2>

            {% endfor %}

    </div>
    {% else %}

    </div>
    {% endif %} -->
</div>

{% if plot_json %}
<script>
    const barData = {{ plot_json | safe }};
    const pieData = {{ pie_json | safe }};

    const config = { responsive: true, displayModeBar: false };

    Plotly.newPlot('bar-chart', barData.data, barData.layout, config);
    Plotly.newPlot('pie-chart', pieData.data, pieData.layout, config);
</script>
{% endif %}
{% endblock %}
