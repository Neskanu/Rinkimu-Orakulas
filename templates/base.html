<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rinkimų Orakulas - Lithuanian Election Predictions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f8fafc;
        }

        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body class="text-slate-800 h-full flex flex-col min-h-screen">
    <nav class="bg-indigo-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-xl font-bold tracking-tight">Rinkimų <span
                            class="text-indigo-400">Orakulas</span></a>
                    <div class="hidden sm:ml-8 sm:flex sm:space-x-8">
                        <a href="/dashboard/"
                            class="text-indigo-200 hover:text-white inline-flex items-center px-1 pt-1 text-sm font-medium">Istoriniai
                            duomenys</a>
                        <a href="/dashboard/backtest"
                            class="text-indigo-200 hover:text-white inline-flex items-center px-1 pt-1 text-sm font-medium">Modelių
                            testavimas</a>
                        <a href="/training/"
                            class="text-indigo-200 hover:text-white inline-flex items-center px-1 pt-1 text-sm font-medium">Modelių
                            apmokymas</a>
                        <a href="/forecast/"
                            class="text-white inline-flex items-center px-1 pt-1 text-sm font-bold border-b-2 border-white">
                            Orakulas 2028</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-10 px-4 sm:px-6 lg:px-8 flex-grow w-full">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white border-t border-slate-200 py-6 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-slate-500 text-xs">
            &copy; 2026 Rinkimų Orakulas. Pažangi rinkimų analitika Lietuvai.
        </div>
    </footer>

    <div id="global-toast-container" class="fixed bottom-5 right-5 flex flex-col gap-3 z-50"></div>

    <script>
        // 1. Ištraukiame jau praneštų modelių sąrašą iš sesijos (kad nespamintų po puslapio perkrovimo)
        let notifiedModels = JSON.parse(sessionStorage.getItem('notifiedModels') || '[]');

        function showToast(message, isError = false) {
            const container = document.getElementById('global-toast-container');
            const toast = document.createElement('div');

            // Tailwind CSS stiliai gražiam pranešimui
            const bgColor = isError ? 'bg-red-600' : 'bg-green-600';
            toast.className = `transform transition-all duration-500 translate-x-full ${bgColor} text-white px-6 py-4 rounded shadow-lg flex items-center justify-between min-w-[300px]`;
            toast.innerHTML = `
        <span class="font-medium">${message}</span>
        <button onclick="this.parentElement.remove()" class="ml-4 text-white hover:text-gray-200">&times;</button>
    `;

            container.appendChild(toast);

            // Animacija įvažiavimui
            setTimeout(() => toast.classList.remove('translate-x-full'), 50);
            // Automatinis išnykimas po 5 sekundžių
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 500);
            }, 5000);
        }

        // 2. Pagrindinė klausymosi (Polling) funkcija
        async function checkTrainingStatus() {
            try {
                const response = await fetch('/training/status');
                if (!response.ok) return;

                const data = await response.json();

                // Jei matome, kad startavo naujas procesas, išvalome seną atmintį
                if (data['SYSTEM'] && data['SYSTEM'].current_stage === 'Initializing' && notifiedModels.length > 0) {
                    notifiedModels = [];
                    sessionStorage.setItem('notifiedModels', JSON.stringify([]));
                }

                // Tikriname kiekvieno modelio statusą
                for (const [modelName, info] of Object.entries(data)) {
                    // Praleidžiame sisteminius raktus
                    if (modelName === 'SYSTEM' || modelName === 'suite_history') continue;

                    // Jei modelis baigė apmokymą ir dar nebuvo parodytas pranešimas
                    if (info.current_stage === 'Finished' && !notifiedModels.includes(modelName)) {
                        let r2Score = info.metrics?.r2 ? info.metrics.r2.toFixed(3) : 'N/A';
                        showToast(`🚀 ${modelName.toUpperCase()} modelis sėkmingai apmokytas! (R²: ${r2Score})`);

                        // Įrašome į atmintį, kad nebekartotų
                        notifiedModels.push(modelName);
                        sessionStorage.setItem('notifiedModels', JSON.stringify(notifiedModels));
                    }

                    // Atliekame tą patį klaidų (Failed) gaudymui
                    if (info.current_stage === 'Failed' && !notifiedModels.includes(modelName)) {
                        showToast(`❌ Klaida apmokant ${modelName.toUpperCase()}.`, true);
                        notifiedModels.push(modelName);
                        sessionStorage.setItem('notifiedModels', JSON.stringify(notifiedModels));
                    }
                }
            } catch (e) {
                // Ignoruojame tyliai, kad netrukdytų jei serveris persikrauna
            }
        }

        // 3. Tikriname serverio būseną kas 3 sekundes
        setInterval(checkTrainingStatus, 3000);
    </script>
</body>

</html>
